name: mac-build

# Hurdle 3 (part 1) for issue #30693: does the FULL openpilot stack BUILD on the
# free macos runner from this fork? openpilot already maintains a build_mac CI job
# (op.sh setup + scons), so this should work — the only wrinkle is LFS (this fork
# has no LFS storage, so point git-lfs at upstream commaai to fetch the model onnx).
on:
  workflow_dispatch:
  push:
    branches: [ mac-build ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Point git-lfs at upstream commaai and pull
        run: |
          git config lfs.url https://github.com/commaai/openpilot.git/info/lfs
          git lfs install --local || true
          git lfs pull || git lfs fetch --all || true
          echo "=== model onnx after lfs pull ==="
          ls -la openpilot/selfdrive/modeld/models/*.onnx
          f=openpilot/selfdrive/modeld/models/driving_supercombo.onnx
          echo "size=$(stat -f%z "$f") (want ~60MB)"

      - name: Remove Homebrew from environment (mirror build_mac)
        run: |
          FILTERED=$(echo "$PATH" | tr ':' '\n' | grep -v '/opt/homebrew' | tr '\n' ':')
          echo "PATH=${FILTERED}/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" >> $GITHUB_ENV

      - name: Make op.sh git-lfs pull non-fatal (a few fork-snapshot objects are absent upstream)
        run: |
          sed -i.bak 's/if ! retry 3 git lfs pull; then/if ! { retry 3 git lfs pull || true; }; then/' tools/op.sh
          grep -n "git lfs pull" tools/op.sh

      - name: op.sh setup
        run: ./tools/op.sh setup

      - name: Build openpilot (scons)
        run: |
          export CI=1
          ./tools/op.sh build || scons -j4

      - name: Install MetaDrive fork (excluded on aarch64 in pyproject)
        run: |
          source "$GITHUB_WORKSPACE/.venv/bin/activate"
          uv pip install "git+https://github.com/commaai/metadrive.git@minimal" 2>&1 | tail -3 || \
            pip install "git+https://github.com/commaai/metadrive.git@minimal"

      - name: Run FULL MetaDrive sim (manager + bridge) on macOS
        continue-on-error: true
        env:
          METADRIVE_SIMPLE_RENDER: "1"
          METADRIVE_NO_MSAA: "1"
          METADRIVE_FLAT_TERRAIN_CARD: "1"
          METADRIVE_RENDER_SCALE: "0.5"
        run: |
          source "$GITHUB_WORKSPACE/.venv/bin/activate"
          export CI=1 PYTHONUNBUFFERED=1
          cd openpilot/tools/sim
          ( python -m pytest -s -o cache_dir=/tmp/pc tests/test_metadrive_bridge.py > /tmp/simtest.txt 2>&1 ) &
          TPID=$!
          # bound the run; macOS has no coreutils `timeout` by default
          for i in $(seq 1 24); do kill -0 $TPID 2>/dev/null || break; sleep 10; done
          kill $TPID 2>/dev/null || true
          pkill -f manager.py 2>/dev/null || true; pkill -f "work/openpilot" 2>/dev/null || true
          echo "=== metadrive render fps lines ==="; grep -iE "metadrive render fps" /tmp/simtest.txt | tail -5
          echo "=== daemons that ran (from managerState / logs) ==="; grep -oiE "starting \w+|\w+d\.py" /tmp/simtest.txt | sort | uniq -c | sort -rn | head -30
          echo "=== test result / assert ==="; grep -iE "PASSED|FAILED|assert|not running|CarEvents|exited with code|Bridge process" /tmp/simtest.txt | head -20
          echo "=== tracebacks ==="
          awk '/Traceback \(most recent call last\)/{p=1} p{print} p&&/^[A-Za-z_.]*(Error|Exception):/{print "----"; p=0}' /tmp/simtest.txt | head -140
          echo "=== error one-liners ==="; grep -iE "no module|dyld|symbol not found|segmentation|abort|/proc|/sys|not found|failed to" /tmp/simtest.txt | sort -u | head -40
          echo "done"

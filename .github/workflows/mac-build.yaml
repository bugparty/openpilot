name: mac-build

# Hurdle 3 (part 1) for issue #30693: does the FULL openpilot stack BUILD on the
# free macos runner from this fork? openpilot already maintains a build_mac CI job
# (op.sh setup + scons), so this should work — the only wrinkle is LFS (this fork
# has no LFS storage, so point git-lfs at upstream commaai to fetch the model onnx).
on:
  workflow_dispatch:
  push:
    branches: [ mac-build ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Point git-lfs at upstream commaai and pull
        run: |
          git config lfs.url https://github.com/commaai/openpilot.git/info/lfs
          git lfs install --local || true
          git lfs pull || git lfs fetch --all || true
          echo "=== model onnx after lfs pull ==="
          ls -la openpilot/selfdrive/modeld/models/*.onnx
          f=openpilot/selfdrive/modeld/models/driving_supercombo.onnx
          echo "size=$(stat -f%z "$f") (want ~60MB)"

      - name: Remove Homebrew from environment (mirror build_mac)
        run: |
          FILTERED=$(echo "$PATH" | tr ':' '\n' | grep -v '/opt/homebrew' | tr '\n' ':')
          echo "PATH=${FILTERED}/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" >> $GITHUB_ENV

      - name: Make op.sh git-lfs pull non-fatal (a few fork-snapshot objects are absent upstream)
        run: |
          sed -i.bak 's/if ! retry 3 git lfs pull; then/if ! { retry 3 git lfs pull || true; }; then/' tools/op.sh
          grep -n "git lfs pull" tools/op.sh

      - name: op.sh setup
        run: ./tools/op.sh setup

      - name: Build openpilot (scons)
        run: |
          export CI=1
          ./tools/op.sh build || scons -j4

      - name: Run openpilot manager in sim mode — does the stack RUN on macOS?
        continue-on-error: true
        run: |
          source "$GITHUB_WORKSPACE/.venv/bin/activate" 2>/dev/null || true
          export CI=1 PYTHONUNBUFFERED=1
          cd openpilot/tools/sim
          ./launch_openpilot.sh > /tmp/oplog.txt 2>&1 &
          LPID=$!
          sleep 60
          echo "=== openpilot python daemons alive after 60s ==="
          ps aux | grep -iE "work/openpilot.*\.py" | grep -v grep | grep -oE "[a-z_]+\.py" | sort | uniq -c | sort -rn | head -40
          echo "=== full tracebacks in log ==="
          awk '/Traceback \(most recent call last\)/{p=1} p{print} /Error|Exception/{if(p)print "----"} p&&/^[A-Za-z].*Error|^[A-Za-z].*Exception/{p=0}' /tmp/oplog.txt | head -120
          echo "=== error one-liners ==="
          grep -iE "no module|not found|failed to|abort|segmentation|panic|dyld|symbol not found|address already|permission denied" /tmp/oplog.txt | sort -u | head -40
          kill $LPID 2>/dev/null || true
          pkill -f manager.py 2>/dev/null || true
          pkill -f "work/openpilot" 2>/dev/null || true
          echo "done"

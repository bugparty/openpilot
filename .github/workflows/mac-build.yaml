name: mac-build

# Hurdle 3 (part 1) for issue #30693: does the FULL openpilot stack BUILD on the
# free macos runner from this fork? openpilot already maintains a build_mac CI job
# (op.sh setup + scons), so this should work — the only wrinkle is LFS (this fork
# has no LFS storage, so point git-lfs at upstream commaai to fetch the model onnx).
on:
  workflow_dispatch:
  push:
    branches: [ mac-build ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Point git-lfs at upstream commaai and pull
        run: |
          git config lfs.url https://github.com/commaai/openpilot.git/info/lfs
          git lfs install --local || true
          git lfs pull || git lfs fetch --all || true
          echo "=== model onnx after lfs pull ==="
          ls -la openpilot/selfdrive/modeld/models/*.onnx
          f=openpilot/selfdrive/modeld/models/driving_supercombo.onnx
          echo "size=$(stat -f%z "$f") (want ~60MB)"

      - name: Remove Homebrew from environment (mirror build_mac)
        run: |
          FILTERED=$(echo "$PATH" | tr ':' '\n' | grep -v '/opt/homebrew' | tr '\n' ':')
          echo "PATH=${FILTERED}/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" >> $GITHUB_ENV

      - name: Make op.sh git-lfs pull non-fatal (a few fork-snapshot objects are absent upstream)
        run: |
          sed -i.bak 's/if ! retry 3 git lfs pull; then/if ! { retry 3 git lfs pull || true; }; then/' tools/op.sh
          grep -n "git lfs pull" tools/op.sh

      - name: op.sh setup
        run: ./tools/op.sh setup

      - name: Build openpilot (scons)
        run: |
          export CI=1
          ./tools/op.sh build || scons -j4

      - name: Install MetaDrive fork (excluded on aarch64 in pyproject)
        run: |
          source "$GITHUB_WORKSPACE/.venv/bin/activate"
          # retry: the git fetch occasionally hits "Could not resolve host: github.com"
          ok=""
          for a in 1 2 3 4 5; do
            if uv pip install "git+https://github.com/commaai/metadrive.git@minimal" 2>&1 | tail -3; then ok=1; break; fi
            echo "metadrive install attempt $a failed, retrying in 10s..."; sleep 10
          done
          [ -n "$ok" ] || pip install "git+https://github.com/commaai/metadrive.git@minimal"
          # HARD ASSERT: the whole point of this workflow is to RUN test_driving. If
          # metadrive isn't importable the test silently skips and pytest exits 0
          # (hollow green). Fail loudly here instead. #30693
          python -c "import metadrive; print('metadrive OK', metadrive.__version__)"

      - name: Rebuild BLASFEO with GENERIC target (arm64-mac asm kernels produce NaN QP solutions)
        run: |
          # HPIPM/BLASFEO from the comma-deps-acados mac wheel NaNs 50-100% of long-MPC
          # solves on this runner (probe below validates). Swap in a plain-C BLASFEO. #30693
          git clone --depth 1 https://github.com/giaf/blasfeo.git /tmp/blasfeo
          # the "Remove Homebrew" step dropped /opt/homebrew/bin (where the runner's cmake lives)
          CMAKE=$(command -v cmake || echo /opt/homebrew/bin/cmake)
          echo "using cmake: $CMAKE"
          "$CMAKE" -S /tmp/blasfeo -B /tmp/blasfeo/build -DTARGET=GENERIC -DBUILD_SHARED_LIBS=ON \
                -DCMAKE_BUILD_TYPE=Release -DBLASFEO_EXAMPLES=OFF > /tmp/blasfeo_cfg.log 2>&1 || { tail -8 /tmp/blasfeo_cfg.log; exit 1; }
          "$CMAKE" --build /tmp/blasfeo/build -j3 > /tmp/blasfeo_bld.log 2>&1 || { tail -8 /tmp/blasfeo_bld.log; exit 1; }
          ACADOS_LIB=$(find "$GITHUB_WORKSPACE/.venv" -name "libblasfeo.dylib" -path "*acados*" | head -1)
          echo "replacing: $ACADOS_LIB"
          echo "build artifacts:"; find /tmp/blasfeo/build -name "libblasfeo*" | head -5
          NEW=$(find /tmp/blasfeo/build -name "libblasfeo*.dylib" | head -1)
          if [ -z "$NEW" ]; then
            # cmake produced a static lib only; wrap it into a dylib
            AR=$(find /tmp/blasfeo/build -name "libblasfeo.a" | head -1)
            clang -dynamiclib -arch arm64 -o /tmp/blasfeo/libblasfeo.dylib -Wl,-force_load,"$AR"
            NEW=/tmp/blasfeo/libblasfeo.dylib
          fi
          install_name_tool -id @rpath/libblasfeo.dylib "$NEW"
          cp "$NEW" "$ACADOS_LIB"
          codesign -f -s - "$ACADOS_LIB"
          echo "done"

      - name: Probe acados long MPC standalone (does the solver work on this host at all?)
        run: |
          source "$GITHUB_WORKSPACE/.venv/bin/activate"
          cd openpilot
          python tools/sim/tests/long_mpc_probe.py

      - name: Run FULL MetaDrive sim (manager + bridge) on macOS
        env:
          METADRIVE_SIMPLE_RENDER: "1"
          METADRIVE_NO_MSAA: "1"
          METADRIVE_FLAT_TERRAIN_CARD: "1"
          METADRIVE_RENDER_SCALE: "0.5"   # 1/2 res holds 20fps on the software renderer; model keeps the lane
          METADRIVE_SKY_CLEAR: "1"   # sky-color the white void so the model doesn't see a phantom lead
          LONG_MPC_DUMP: "1"   # print x0/params on every failed QP solve (#30693)
          SIM_ACCEL_TO_THROTTLE: "2.5"  # metadrive thrust response; 1.6 overshoots planV by ~35% -> out_of_lane
          SIM_MAX_SPEED: "6"  # cap well below cruise: on the loaded VM the control loop lags, so lower speed gives the delayed steering time to track curves (out_of_lane margin). #30693
          BLOCK: "soundd"   # sound .wav assets are LFS-absent on the fork; not needed for the test
        run: |
          set +e   # default shell is `bash -e`; manage the exit code ourselves so a
                   # non-matching diagnostic grep or a failing `wait` doesn't abort early
          source "$GITHUB_WORKSPACE/.venv/bin/activate"
          export CI=1 PYTHONUNBUFFERED=1
          cd openpilot/tools/sim
          # sample per-process CPU during the run: is the SOFTWARE RENDER (metadrive
          # process, LLVMpipe) starving the control loop (modeld/plannerd/controlsd)
          # on the 3-core VM? quantifies whether HW render offload would cut the lag. #30693
          ( for k in $(seq 1 40); do
              echo "=== @t=$k ==="
              ps -Ao %cpu,pid,command 2>/dev/null | sort -rn | head -14
              sleep 1.5
            done > /tmp/cpusample.txt 2>&1 ) &
          CPUMON=$!
          # Run pytest in the FOREGROUND so its exit code is the authoritative pass/fail
          # signal (a backgrounded `... &` subshell swallows the exit code -> false green).
          # macOS has no coreutils `timeout`, so a background watchdog kills a hang.
          python -m pytest -s -o cache_dir=/tmp/pc tests/test_metadrive_bridge.py > /tmp/simtest.txt 2>&1 &
          PYPID=$!
          ( sleep 300; kill -9 "$PYPID" 2>/dev/null ) & WDOG=$!
          wait "$PYPID"; CODE=$?
          kill "$WDOG" 2>/dev/null || true; kill "$CPUMON" 2>/dev/null || true
          pkill -f manager.py 2>/dev/null || true; pkill -f "work/openpilot" 2>/dev/null || true
          # HARD ASSERT against a hollow green: a SKIPPED test_driving exits 0. Require a real pass.
          if ! grep -qaE "1 passed" /tmp/simtest.txt; then
            echo "!!! test_driving did NOT pass (skipped or failed) -- forcing failure"; CODE=1
          fi
          echo "=== pytest summary (authoritative) ==="; grep -aE " passed| failed| error| skipped" /tmp/simtest.txt | tail -3
          echo "=== CPU by process (software render vs control loop) ==="; cp /tmp/cpusample.txt "$GITHUB_WORKSPACE/cpusample.txt" 2>/dev/null || true; tail -4 /tmp/cpusample.txt 2>/dev/null | tr '|' '\n' | grep -aiE "python|render|metadrive|%CPU" | head -20
          echo "=== render fps ==="; grep -iaE "metadrive render fps" /tmp/simtest.txt | tail -3
          echo "=== assert / CarEvents / failure states ==="; grep -aiE "AssertionError|FAILED |CarEvents '\[|Failure states|not running '\[|did not engage" /tmp/simtest.txt | head -10
          echo "=== tracebacks ==="; awk '/Traceback \(most recent call last\)/{p=1} p{print} p&&/^[A-Za-z_.]*(Error|Exception):/{print "----"; p=0}' /tmp/simtest.txt | head -80
          echo "=== longitudinal / MPC / engage signals ==="; grep -aiE "\[lng\]|SQP_RTI|QP solver|longActive|accel|vCruise|cameraOdometry ignored|models loaded in|control.*active|standstill|should_stop|experimentalMode" /tmp/simtest.txt | grep -aivE "render fps" | tail -40
          # preserve the FULL sim stdout for audit (the grepped summaries above discard most of it)
          cp /tmp/simtest.txt "$GITHUB_WORKSPACE/simtest_full.txt" 2>/dev/null || true
          # preserve the dumped model-input frames for artifact inspection
          cp /tmp/modelframe_*.png "$GITHUB_WORKSPACE/" 2>/dev/null || true
          echo "=== dumped model-input frames ==="; ls -la "$GITHUB_WORKSPACE"/modelframe_*.png 2>/dev/null || echo "(none)"
          echo "pytest exit code: $CODE"
          exit "$CODE"

      - name: Upload full sim log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simtest-full-log
          path: |
            simtest_full.txt
            cpusample.txt
          if-no-files-found: warn

      - name: Upload model-input frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-input-frames
          path: modelframe_*.png
          if-no-files-found: warn

name: metal-render

# Hurdle #2 for issue #30693: can MetaDrive render headlessly at >=20 fps on the
# FREE macos-14 (M1) runner? Builds MetaDriveEnv with the exact sim-bridge config
# (single rgb_road camera at 1928x1208, image_on_cuda off, use_render off) and
# times perceive() render throughput. Camera class is inlined so we don't pull in
# openpilot's compiled camerad/VisionIPC stack.
#
# Note: openpilot's own pyproject excludes metadrive on aarch64, so we install the
# comma fork (commaai/metadrive@minimal) directly and see if it works on macOS arm64.
on:
  workflow_dispatch:
  push:
    branches: [ metal-probe ]

jobs:
  render:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install comma MetaDrive fork (+ panda3d)
        run: |
          python -m pip install --upgrade pip
          pip install numpy "git+https://github.com/commaai/metadrive.git@minimal"
          python -c "import panda3d, metadrive; print('panda3d', panda3d.__version__ if hasattr(panda3d,'__version__') else '?'); print('metadrive ok')"

      - name: Write render benchmark
        run: |
          cat > render_bench.py <<'PY'
          import os, time, numpy as np
          from panda3d.core import loadPrcFileData
          if os.environ.get("TINYDISPLAY"):
            # Path "tinydisplay+A": use Panda3D's own software rasterizer instead of
            # Apple Software Renderer. Native offscreen (no Cocoa window/pixel-format issue).
            loadPrcFileData("", "load-display p3tinydisplay")
            print("[forcing p3tinydisplay software rasterizer]", flush=True)
          # importing engine_core runs its class-body PRC (multisamples 8/4). Our bare
          # offscreen-buffer probe worked with NO multisample; ShowBase's offscreen main
          # window fails on headless Cocoa because it requests multisample. Override AFTER
          # import so our values win (PRC = last-loaded-wins).
          import metadrive.engine.core.engine_core as _ec
          _ec.is_mac = lambda: False           # keep mode == offscreen (=> BFRefuseWindow path)
          # simplepbr sets up a MAIN-WINDOW tonemap post-process that is degenerate in
          # headless (1x1 disabled main window) -> crashes. pbrpipe is never used later in
          # engine_core; camera sensors + terrain render independently. Skip it.
          _ec.init = lambda *a, **k: None
          # PSSM shadow-map buffer also can't be created headless and pssm is never used
          # later in engine_core. Stub it (terrain shadow input, if any, degrades gracefully).
          class _NoPSSM:
            def __init__(self, *a, **k): pass
            def __getattr__(self, n): return lambda *a, **k: None
          _ec.PSSM = _NoPSSM

          # ROOT CAUSE: ShowBase._doOpenWindow uses fbprops=FrameBufferProperties.getDefault(),
          # which the headless Cocoa first-buffer can't match ("no usable pixel format").
          # Our bare probe proved a MINIMAL fbprops (rgba8+depth) opens fine. Inject it.
          from direct.showbase import ShowBase as _SB
          from panda3d.core import FrameBufferProperties as _FBP
          _orig_doopen = _SB.ShowBase._doOpenWindow
          def _doopen(self, *a, **kw):
            if kw.get("fbprops") is None:
              fb = _FBP(); fb.setRgbColor(True); fb.setRgbaBits(8,8,8,8); fb.setDepthBits(24)
              kw["fbprops"] = fb
            return _orig_doopen(self, *a, **kw)
          _SB.ShowBase._doOpenWindow = _doopen

          from metadrive.component.map.pg_map import MapGenerateMethod
          from metadrive.envs.metadrive_env import MetaDriveEnv
          from metadrive.component.sensors.rgb_camera import RGBCamera
          from panda3d.core import Texture, GraphicsOutput, Vec3

          W, H = 1928, 1208  # tici camera res the model consumes

          class CopyRamRGBCamera(RGBCamera):
            def _setup_effect(self):
              # JPL11's slim override: keep terrain tag state, but SKIP the float16 HDR
              # buffer + multisample + tonemap post-pass (FilterManager.render_scene_into
              # returns None headless). Camera renders straight into the 8-bit buffer.
              from metadrive.constants import Semantics, CameraTagStateKey
              from metadrive.engine.core.terrain import Terrain
              cam = self.get_cam().node()
              cam.setTagStateKey(CameraTagStateKey.RGB)
              cam.setTagState(Semantics.TERRAIN.label,
                              Terrain.make_render_state(self.engine, "terrain.vert.glsl", "terrain.frag.glsl"))
            def __init__(self, *a, **k):
              super().__init__(*a, **k)
              self.cpu_texture = Texture()
              self.buffer.addRenderTexture(self.cpu_texture, GraphicsOutput.RTMCopyRam)
            def get_rgb_array_cpu(self):
              t = self.cpu_texture
              return np.frombuffer(t.getRamImageAs("RGB").getData(), dtype=np.uint8).reshape((t.getYSize(), t.getXSize(), 3))[::-1]

          class RGBCameraRoad(CopyRamRGBCamera):
            def __init__(self, *a, **k):
              super().__init__(*a, **k)
              lens = self.get_lens(); lens.setFov(40); lens.setNear(0.1)

          def straight(l): return {"id":"S","pre_block_socket_index":0,"length":l}
          def curve(l,angle=45,d=0): return {"id":"C","pre_block_socket_index":0,"length":l,"radius":l,"angle":angle,"dir":d}
          def create_map(ts=60):
            cl=ts*2
            return {"type":MapGenerateMethod.PG_MAP_FILE,"lane_num":2,"lane_width":4.5,
                    "config":[None,straight(ts),curve(cl,90),straight(ts),curve(cl,90),straight(ts),curve(cl,90),straight(ts),curve(cl,90)]}

          config = {
            "use_render": False,
            "vehicle_config": {"enable_reverse": False, "render_vehicle": False, "image_source": "rgb_road"},
            "sensors": {"rgb_road": (RGBCameraRoad, W, H)},
            "image_on_cuda": False, "image_observation": True, "interface_panel": [],
            "out_of_route_done": False, "on_continuous_line_done": False, "crash_vehicle_done": False,
            "crash_object_done": False, "arrive_dest_done": False, "traffic_density": 0.0,
            "map_config": create_map(), "decision_repeat": 1, "physics_world_step_size": 5/100,
            "preload_models": False, "show_logo": False, "anisotropic_filtering": False,
          }

          config.pop("arrive_dest_done", None)  # bridge pops this before constructing env
          print("creating MetaDriveEnv...", flush=True)
          t0 = time.perf_counter()
          env = MetaDriveEnv(config)
          env.reset()
          print(f"env ready in {time.perf_counter()-t0:.1f}s", flush=True)
          # Is the headless Cocoa GL hardware or software? (decides if 674fps perceive was real)
          try:
            gsg = env.engine.win.getGsg()
            print(f"GL_VENDOR   : {gsg.getDriverVendor()}", flush=True)
            print(f"GL_RENDERER : {gsg.getDriverRenderer()}", flush=True)
            print(f"GL_VERSION  : {gsg.getDriverVersion()}", flush=True)
          except Exception as _e:
            print("gsg query failed:", _e, flush=True)

          cam = env.engine.sensors["rgb_road"]
          cam.get_cam().reparentTo(env.vehicle.origin)
          cam.get_cam().setPos(Vec3(0,0,1.22)); cam.get_cam().setHpr(Vec3(0,0,0))

          import statistics
          def med_ms(fn, N):
            fn(); fn()  # extra warmup (JIT/shader compile)
            ts = []
            for _ in range(N):
              t = time.perf_counter(); fn(); ts.append((time.perf_counter()-t)*1e3)
            return statistics.median(ts), min(ts), max(ts)

          for _ in range(20):  # generous warmup
            env.step([0,0.0]); cam.perceive(to_float=False)

          N = 60
          p_med, p_min, p_max = med_ms(lambda: cam.perceive(to_float=False), N)
          print(f"perceive-only : median {p_med:6.1f} ms  (min {p_min:.1f} / max {p_max:.1f})  -> {1000/p_med:.1f} fps", flush=True)
          s_med, s_min, s_max = med_ms(lambda: env.step([0,0.0]), N)
          print(f"step-only     : median {s_med:6.1f} ms  (min {s_min:.1f} / max {s_max:.1f})  -> {1000/s_med:.1f} fps", flush=True)
          c_med, c_min, c_max = med_ms(lambda: (env.step([0,0.0]), cam.perceive(to_float=False)), N)
          print(f"step+perceive : median {c_med:6.1f} ms  (min {c_min:.1f} / max {c_max:.1f})  -> {1000/c_med:.1f} fps   need >= 20", flush=True)
          ge = env.engine.graphicsEngine
          r_med, r_min, r_max = med_ms(lambda: ge.render_frame(), N)
          print(f"renderFrame   : median {r_med:6.1f} ms  (min {r_min:.1f} / max {r_max:.1f})  -> {1000/r_med:.1f} fps   <- TRUE per-frame", flush=True)
          print("img shape:", np.asarray(cam.perceive(to_float=False)).shape, flush=True)

          # ---- profile where env.step's ~386 ms actually goes ----
          import cProfile, pstats, io as _io
          pr = cProfile.Profile()
          pr.enable()
          for _ in range(10): env.step([0,0.0])
          pr.disable()
          s = _io.StringIO()
          ps = pstats.Stats(pr, stream=s).sort_stats("tottime")
          ps.print_stats(25)
          print("==== env.step cProfile (tottime, 10 steps) ====", flush=True)
          print(s.getvalue(), flush=True)
          PY

      - name: Enumerate ALL Panda3D display backends / pipes
        continue-on-error: true
        run: |
          cat > enum_backends.py <<'PY'
          from panda3d.core import (GraphicsPipeSelection, GraphicsEngine, FrameBufferProperties,
                                    WindowProperties, GraphicsPipe)
          sel = GraphicsPipeSelection.getGlobalPtr()
          sel.load_aux_modules()                 # try to load every available display module
          n = sel.get_num_pipe_types()
          print(f"# Panda3D knows {n} pipe type(s):", flush=True)
          engine = GraphicsEngine.getGlobalPtr()
          for i in range(n):
            t = sel.get_pipe_type(i)
            name = t.get_name()
            try:
              pipe = sel.make_pipe(t)
            except Exception as e:
              print(f"  - {name:24} make_pipe FAILED: {e}", flush=True); continue
            if pipe is None:
              print(f"  - {name:24} make_pipe -> None", flush=True); continue
            fb = FrameBufferProperties(); fb.set_rgb_color(True); fb.set_rgba_bits(8,8,8,8); fb.set_depth_bits(24)
            wp = WindowProperties.size(128,128)
            buf = engine.make_output(pipe, "b", 0, fb, wp, GraphicsPipe.BFRefuseWindow)
            engine.render_frame()
            if buf is None:
              print(f"  - {name:24} interface={pipe.get_interface_name():10} buffer=None", flush=True); continue
            gsg = buf.get_gsg()
            r = gsg.get_driver_renderer() if gsg else "no-gsg"
            print(f"  - {name:24} interface={pipe.get_interface_name():10} renderer={r}", flush=True)
            try: engine.remove_window(buf)
            except Exception: pass
          PY
          echo "=== default modules ==="; python3 enum_backends.py
          echo "=== force p3tinydisplay (pure software raster) ==="; python3 -c "from panda3d.core import loadPrcFileData; loadPrcFileData('','load-display p3tinydisplay')" 2>/dev/null; PANDA_PRC_DIR= python3 -c "
          from panda3d.core import loadPrcFileData
          loadPrcFileData('', 'load-display p3tinydisplay')
          import runpy; runpy.run_path('enum_backends.py', run_name='__main__')" || true

      - name: HARDWARE vs SOFTWARE OpenGL probe (is hw GL really unavailable headless?)
        continue-on-error: true
        run: |
          cat > gl_hw.py <<'PY'
          from panda3d.core import (GraphicsPipeSelection, GraphicsEngine, FrameBufferProperties,
                                    WindowProperties, GraphicsPipe, loadPrcFileData)
          # try a windowed offscreen path too
          import os
          for _l in os.environ.get("EXTRA_PRC","").split(";"):
            if _l.strip(): loadPrcFileData("", _l.strip())
          sel = GraphicsPipeSelection.getGlobalPtr()
          engine = GraphicsEngine.getGlobalPtr()
          pipe = sel.makeDefaultPipe()

          def probe(label, force_hw=False, force_sw=False, msaa=0, wintype="buffer"):
            fb = FrameBufferProperties()
            fb.setRgbColor(True); fb.setRgbaBits(8,8,8,8); fb.setDepthBits(24)
            if force_hw: fb.setForceHardware(True)
            if force_sw: fb.setForceSoftware(True)
            if msaa: fb.setMultisamples(msaa)
            wp = WindowProperties.size(256, 256)
            flags = GraphicsPipe.BFRefuseWindow if wintype=="buffer" else GraphicsPipe.BFRequireWindow
            flags |= GraphicsPipe.BFFbPropsOptional
            buf = engine.makeOutput(pipe, label, 0, fb, wp, flags)
            engine.renderFrame()
            if buf is None:
              print(f"  {label:22} -> None (not available)", flush=True); return
            gsg = buf.getGsg()
            if gsg is None:
              print(f"  {label:22} -> buffer but NO gsg", flush=True); return
            hw = "?"
            try: hw = "HARDWARE" if gsg.getDriverRenderer() and "Software" not in gsg.getDriverRenderer() else "software"
            except Exception: pass
            print(f"  {label:22} -> {gsg.getDriverRenderer()}  [{hw}]", flush=True)
            try: engine.removeWindow(buf)
            except Exception: pass

          print("pipe:", pipe.getInterfaceName() if pipe else None, flush=True)
          probe("default")
          probe("force_hardware", force_hw=True)
          probe("force_hw+msaa4", force_hw=True, msaa=4)
          probe("force_software", force_sw=True)
          probe("require_window", wintype="window")
          probe("require_window_hw", force_hw=True, wintype="window")
          PY
          echo "=== default env ==="; python3 gl_hw.py
          echo "=== with gl-version 4 1 + multisamples ==="; EXTRA_PRC="gl-version 4 1;framebuffer-multisample 1;multisamples 4" python3 gl_hw.py

      - name: Run render benchmark (MetaDrive) — Apple Software GL
        continue-on-error: true
        run: python3 render_bench.py

      - name: Run render benchmark (MetaDrive) — p3tinydisplay
        continue-on-error: true
        env:
          TINYDISPLAY: "1"
        run: python3 render_bench.py
